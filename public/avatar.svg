<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="hairPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a85" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <linearGradient id="visorCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="avatarGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="url(#avatarBg)" stroke="#ff2a85" stroke-width="2"/>

  <!-- Anime Hair Back -->
  <path d="M22,50 C18,30 30,15 50,15 C70,15 82,30 78,50 C82,65 78,80 75,90 L25,90 C22,80 18,65 22,50 Z" fill="url(#hairPink)"/>

  <!-- Face -->
  <path d="M32,40 C32,32 68,32 68,40 C68,60 62,72 50,75 C38,72 32,60 32,40 Z" fill="#ffe4d6"/>

  <!-- VR Visor / Cyber Goggles -->
  <polygon points="26,38 74,38 71,52 50,55 29,52" fill="url(#visorCyan)" filter="url(#avatarGlow)"/>
  <line x1="32" y1="45" x2="68" y2="45" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="8,4"/>
  <circle cx="28" cy="45" r="2.5" fill="#ffe600"/>
  <circle cx="72" cy="45" r="2.5" fill="#ffe600"/>

  <!-- Hair Bangs Front -->
  <path d="M25,25 L35,42 L42,30 L50,45 L58,28 L66,42 L75,25 C68,14 32,14 25,25 Z" fill="url(#hairPink)"/>

  <!-- Cyber Mask / Collar -->
  <polygon points="38,62 62,62 58,78 42,78" fill="#18181b" stroke="#00f0ff" stroke-width="1.5"/>
  <line x1="44" y1="70" x2="56" y2="70" stroke="#ff2a85" stroke-width="1.5"/>

  <!-- Headset Ear Piece -->
  <rect x="22" y="38" width="6" height="14" rx="3" fill="#27272a" stroke="#00f0ff" stroke-width="1"/>
  <rect x="72" y="38" width="6" height="14" rx="3" fill="#27272a" stroke="#00f0ff" stroke-width="1"/>
</svg>
